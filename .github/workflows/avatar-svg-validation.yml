name: Avatar SVG isolation validation
on:
  push:
    branches: [codex/avatar-svg-validation]
permissions:
  contents: read
concurrency:
  group: avatar-svg-validation
  cancel-in-progress: false
jobs:
  verify:
    # Completed failed intervention; retain evidence, do not rerun unchanged.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    container: python:3.12-trixie@sha256:0d0db5b17f11b1b7d1aafa74ceadaa64ba0944b267ff6fc22008a197acd6b9ad
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium=156.0.8078.47-1~deb13u1 chromium-common=156.0.8078.47-1~deb13u1 git procps
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check accounting
        run: .venv/bin/python -m pytest tests/test_avatar_source_isolation.py -q
      - name: Measure exact SVG intervention in both orders
        run: .venv/bin/python scripts/avatar_baseline/source_isolation.py --validation-arm svg --output avatar-svg-validation --browser-dir /usr/bin
      - name: Audit all samples
        if: ${{ !cancelled() }}
        run: .venv/bin/python scripts/avatar_baseline/analyze_source_isolation.py avatar-svg-validation
      - name: Preserve complete and failed cohorts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-svg-validation
          path: avatar-svg-validation/
          retention-days: 30
