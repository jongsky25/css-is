name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    uses: ./.github/workflows/release-checks.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
