name: Deploy to Hugging Face

# Auto-deploys on every push to main (re-enabled 2026-07-17 — the Space
# (equityinhealth/office-connect) wedge that led to disabling this in #21 has
# been confirmed cleared). Runs deploy_hf.py, which still hard-aborts
# (CSS_DEPLOY_STRICT_VERSION below) if a merge forgot to bump APP_VERSION in
# version.py, so a wedge or a missed version bump fails loudly instead of
# silently shipping nothing / shipping unversioned.
#
# Manual runs use the same verification and backup gates as automatic releases.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never let two deploys overlap (each one restarts the live Space).
concurrency:
  group: hf-deploy
  cancel-in-progress: false

jobs:
  verification:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-checks.yml
    with:
      base_sha: ${{ github.event.before || 'HEAD^' }}

  deploy:
    needs: verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same reviewed client and transitive packages on every deployment.
      - name: Install deploy dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-deploy.txt

      - name: Deploy (runs the exact same routine as the local deploy_hf.py)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}          # HF write token (user equityinhealth)
          CSS_ADMIN_USER: ${{ secrets.CSS_ADMIN_USER }}  # for the pre-deploy backup gate
          CSS_ADMIN_PASS: ${{ secrets.CSS_ADMIN_PASS }}
          CSS_DEPLOY_STRICT_VERSION: "1"             # hard-abort if APP_VERSION wasn't bumped
          CSS_TELEGRAM_OUTBOUND_SETUP: "1"           # optional public merge trailers; setup remains backup-gated
        run: |
          python deploy_hf.py --yes

  telegram-diagnostics:
    name: Read Telegram worker diagnostics
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read sanitized Operations metadata
        env:
          CSS_ADMIN_USER: ${{ secrets.CSS_ADMIN_USER }}
          CSS_ADMIN_PASS: ${{ secrets.CSS_ADMIN_PASS }}
        run: |
          python -c "import deploy_hf; raise SystemExit(0 if deploy_hf.report_live_telegram_status() else 1)"
