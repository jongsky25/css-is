name: Deploy to Hugging Face

# Push trigger re-enabled (2026-07-17): the RUNNING_BUILDING wedge that hit the
# Space after the 01:47:55 UTC v1.99 deploy cleared on its own — the queued
# build finally executed at 07:23 UTC, finished cleanly in ~1 min, and the live
# Space now serves v1.99 in the RUNNING stage. (It was disabled while wedged so
# merges wouldn't stack more deploys onto the stuck build queue.)
#
# Manual runs also work via workflow_dispatch — open this repo on the GitHub
# mobile site → Actions → "Deploy to Hugging Face" → Run workflow (e.g. to
# retry, or to pass skip_backup). Either way it's the same deploy_hf.py
# routine, so a manual run still hard-aborts (CSS_DEPLOY_STRICT_VERSION below)
# if a merge forgot to bump APP_VERSION in version.py.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_backup:
        description: "DANGER: skip the pre-deploy DB backup gate (only if backup infra is down)"
        type: boolean
        default: false

# Never let two deploys overlap (each one restarts the live Space).
concurrency:
  group: hf-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # deploy_hf.py needs only huggingface_hub; pull_backup.py is stdlib-only.
      - name: Install deploy dependency
        run: pip install "huggingface_hub>=0.23"

      - name: Deploy (runs the exact same routine as the local deploy_hf.py)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}          # HF write token (user equityinhealth)
          CSS_ADMIN_USER: ${{ secrets.CSS_ADMIN_USER }}  # for the pre-deploy backup gate
          CSS_ADMIN_PASS: ${{ secrets.CSS_ADMIN_PASS }}
          CSS_DEPLOY_STRICT_VERSION: "1"             # hard-abort if APP_VERSION wasn't bumped
        run: |
          python deploy_hf.py --yes ${{ inputs.skip_backup && '--skip-backup' || '' }}
