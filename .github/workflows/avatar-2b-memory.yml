name: Avatar 2B memory diagnosis
on:
  workflow_dispatch:
  push:
    branches: [codex/avatar-2b-memory-lifecycle]
permissions:
  contents: read
concurrency:
  group: avatar-2b-memory-lifecycle
  cancel-in-progress: false
jobs:
  verify:
    # Completed diagnosis is preserved; resume only for a new attribution experiment.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    container: python:3.12-trixie@sha256:0d0db5b17f11b1b7d1aafa74ceadaa64ba0944b267ff6fc22008a197acd6b9ad
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact browser and locked test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium=156.0.8078.47-1~deb13u1 chromium-common=156.0.8078.47-1~deb13u1 git procps
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify evidence accounting
        run: .venv/bin/python -m pytest tests/test_avatar_verification_result.py tests/test_avatar_memory_audit.py -q
      - name: Measure original and current in both orders
        env:
          CSS_AVATAR_CHROMIUM: 156.0.8078.47
        run: .venv/bin/python scripts/avatar_baseline/memory_diagnostic.py
      - name: Retain every measurement and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-2b-memory-diagnostic
          path: avatar-verification/
          retention-days: 30
