name: Avatar 2B geometry lifecycle candidate
on:
  workflow_dispatch:
  push:
    branches: [codex/avatar-2b-geometry-lifecycle]
permissions:
  contents: read
concurrency:
  group: avatar-2b-geometry-candidate
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: python:3.12-trixie@sha256:0d0db5b17f11b1b7d1aafa74ceadaa64ba0944b267ff6fc22008a197acd6b9ad
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact browser and locked test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium=156.0.8078.47-1~deb13u1 chromium-common=156.0.8078.47-1~deb13u1 git procps
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify evidence accounting
        run: .venv/bin/python -m pytest tests/test_avatar_verification_result.py tests/test_avatar_memory_audit.py tests/test_avatar_targeted_memory.py tests/test_avatar_candidate_audit.py tests/test_avatar_source_isolation.py -q
      - name: Verify real navigation teardown and persisted-page preservation
        env:
          CSS_TEST_NOW: '2026-07-15T12:00:00'
          CSS_AVATAR_CHROMIUM: 156.0.8078.47
          CSS_AVATAR_BASELINE: '1'
          CSS_AVATAR_OUT: avatar-verification/lifecycle-behavior
        run: .venv/bin/python -m pytest tests/test_avatar_geometry_browser.py tests/test_avatar_geometry_lifecycle_browser.py -q
      - name: Measure original, unchanged current and candidate in both orders
        env:
          CSS_AVATAR_CHROMIUM: 156.0.8078.47
        run: .venv/bin/python scripts/avatar_baseline/lifecycle_candidate.py
      - name: Independently audit all source hashes and raw comparisons
        run: .venv/bin/python scripts/avatar_baseline/audit_lifecycle_candidate.py avatar-verification/lifecycle-candidate --candidate-ref "$GITHUB_SHA" --out avatar-verification/independent-audit.json
      - name: Retain every measurement and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-2b-geometry-candidate
          path: avatar-verification/
          retention-days: 30
