name: Avatar native recorder calibration

# The PR trigger validates initial setup before default-branch registration.
# Once merged, Run workflow is available in GitHub's phone browser UI.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/avatar-native-calibration.yml

permissions:
  contents: read

concurrency:
  group: avatar-cloud-native-calibration
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Native recorder calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: python:3.12.14-trixie@sha256:4d1caded1f729ae443eb803f26ffde7b61e696aeaef62f099abb6dd6b14257c7
    # Scope ptrace to the job container for its own synthetic renderer.
    options: --cap-add=SYS_PTRACE
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the frozen diagnostic harness
        uses: actions/checkout@v4
        with:
          # Never check out product changes from the pull-request head.
          ref: 0af68b81a2f1ecb86526f20f23d8e32c0de70f44
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact browser and hash-locked dependencies
        run: |
          set -euo pipefail
          mkdir -p native-calibration
          exec > >(tee native-calibration/setup.log) 2>&1
          apt-get update
          apt-get install -y --no-install-recommends \
            chromium=156.0.8078.47-1~deb13u1 \
            chromium-common=156.0.8078.47-1~deb13u1 \
            git procps binutils util-linux
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-avatar-native.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /workspace/scratch/avatar-runtime/root/usr/lib/chromium
          ln -s /usr/lib/chromium/chromium /workspace/scratch/avatar-runtime/root/usr/lib/chromium/chromium

      - name: Check native calibration accounting before measurement
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/test_hosted_native_calibration.py \
            tests/test_native_recorder_selftest.py \
            tests/test_mixed_getter_capability.py \
            tests/test_absent_attribute_capability.py \
            tests/test_membership_lifecycle_analysis.py \
            tests/test_membership_lifecycle_summary.py \
            2>&1 | tee native-calibration/preflight-tests.txt

      - name: Prove the native recorder and capture the full fixed calibration
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.avatar_baseline.hosted_native_calibration \
            --out native-calibration/result \
            2>&1 | tee native-calibration/run.log

      - name: Explain missing results on the phone summary
        if: always()
        run: |
          if [ ! -f native-calibration/result/SUMMARY.md ]; then
            {
              echo '# Native recorder calibration'
              echo ''
              echo 'Setup or a prerequisite stopped before complete native calibration was available.'
              echo 'Open the failed step and download avatar-native-calibration for retained logs.'
              echo 'No application acceptance or deployment occurred.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save all results and failures for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-native-calibration
          path: native-calibration/
          if-no-files-found: warn
          retention-days: 30
