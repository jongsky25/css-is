name: Avatar 2B verification
on:
  workflow_dispatch:
  push:
    branches: [codex/avatar-2b-verification]
permissions:
  contents: read
concurrency:
  group: avatar-2b-verification
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    container: python:3.12-trixie@sha256:0d0db5b17f11b1b7d1aafa74ceadaa64ba0944b267ff6fc22008a197acd6b9ad
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install exact browser and locked test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends chromium=156.0.8078.47-1~deb13u1 chromium-common=156.0.8078.47-1~deb13u1 git procps
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Verify evidence accounting
        run: .venv/bin/python -m pytest tests/test_avatar_verification_result.py -q
      - name: Run every verification phase sequentially
        if: success()
        env:
          CSS_AVATAR_CHROMIUM: 156.0.8078.47
        run: |
          failed=0
          for phase in functional focused runtime matrix; do
            .venv/bin/python scripts/avatar_baseline/ci_verify.py "$phase" || failed=1
          done
          exit "$failed"
      - name: Retain every measurement and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-2b-complete
          path: avatar-verification/
          retention-days: 7
