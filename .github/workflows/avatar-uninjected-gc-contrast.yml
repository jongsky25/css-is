name: Avatar uninjected GC comparison

# The PR trigger validates initial setup before default-branch registration.
# Once merged, Run workflow is available in GitHub's phone browser UI.
on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    paths:
      - .github/workflows/avatar-uninjected-gc-contrast.yml

permissions:
  contents: read

concurrency:
  group: avatar-cloud-uninjected-gc-contrast
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Uninjected GC comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # This comparison forbids browser injection and explicitly drops ptrace.
    container:
      image: python:3.12.14-trixie@sha256:4d1caded1f729ae443eb803f26ffde7b61e696aeaef62f099abb6dd6b14257c7
      options: --cap-drop=SYS_PTRACE
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the frozen diagnostic harness
        uses: actions/checkout@v4
        with:
          # Never check out product changes from the pull-request head.
          ref: 8f7b7d4c7970ef09cfa3c71b2ce6b40b720ffd85
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact browser and hash-locked dependencies
        run: |
          set -euo pipefail
          mkdir -p uninjected-gc
          exec > >(tee uninjected-gc/setup.log) 2>&1
          apt-get update
          apt-get install -y --no-install-recommends \
            chromium=156.0.8078.47-1~deb13u1 \
            chromium-common=156.0.8078.47-1~deb13u1 \
            git procps binutils util-linux
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-avatar-native.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /workspace/scratch/avatar-runtime/root/usr/lib/chromium
          ln -s /usr/lib/chromium/chromium /workspace/scratch/avatar-runtime/root/usr/lib/chromium/chromium

      - name: Check uninjected capture and trace guards
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/test_uninjected_gc_contrast.py \
            tests/test_membership_lifecycle_analysis.py \
            2>&1 | tee uninjected-gc/preflight-tests.txt

      - name: Compare uninjected counters with GC tracing
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.avatar_baseline.uninjected_gc_contrast \
            --out uninjected-gc/result \
            2>&1 | tee uninjected-gc/run.log

      - name: Explain missing results on the phone summary
        if: always()
        run: |
          if [ ! -f uninjected-gc/result/SUMMARY.md ]; then
            {
              echo '# Uninjected GC comparison'
              echo ''
              echo 'Setup or a prerequisite stopped before the context diagnostic completed.'
              echo 'Open the failed step and download avatar-uninjected-gc for retained logs.'
              echo 'Context diagnostic only. No qualification, acceptance or deployment occurred.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save all results and failures for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-uninjected-gc
          path: uninjected-gc/
          if-no-files-found: warn
          retention-days: 30
