<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline · Office Connect</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="pub-wrap">
  <div class="pub-card" style="text-align:center;">
    <h1 style="margin-top:0;">You're offline</h1>
    <p class="muted">This page hasn't been opened on this device yet, so it can't
      load without a connection.</p>
    <p class="muted small">Reconnect to the internet, then try again. Surveys you've
      already opened while online will still load offline.</p>
    <button class="btn" type="button" onclick="location.reload()">Try again</button>
  </div>
</div>
</body>
</html>
