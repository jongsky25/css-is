<html><meta charset="utf-8">
<style>
  .av-v2 { --av-outline:#815b43; --av-leaf-outline:#41664c; --av-rose-outline:#b46883; }
  svg[data-avatar-mode="personal"] .av-regalia, svg[data-avatar-mode="none"] .av-regalia { display:none; }
  .avwrap { display:inline-block; text-align:center; position:relative;
            --av-sway:7s; --av-breathe:6.4s; perspective:700px; }
  .av-play-btn { display:block; border:0; padding:0; width:100%; background:transparent;
                 color:inherit; cursor:pointer; border-radius:1rem; }
  .av-care-btn, .av-sound-btn, .av-explore-btn { min-width:44px; min-height:44px; }
  .avwrap svg { display:block; overflow:visible;
                filter:drop-shadow(0 8px 6px rgba(20,30,50,.16)); }
  /* Illustrated companions supply drawn shadows: avoid repainting a filtered SVG. */
  .avwrap svg[data-avatar-art="v2"] { filter:none; }
  /* Whole-body 3D lean toward the cursor (avatars.js "curiosity" loop sets the
     rotateX/rotateY inline; perspective above is what makes them read as depth
     rather than a flat skew). Species.js clears the transition while actively
     tracking so the lean stays snappy, and turns it back on only to settle
     flat again once the pointer leaves — see the pointermove handler. */
  .av-tiltstage { transform-style:preserve-3d; will-change:transform; }
  .avmove  { transform-box:fill-box; will-change:transform; }
  .avstage { transform-box:fill-box; transform-origin:50% 92%; }
  .fam-plant  .avstage { animation:av-sway var(--av-sway) ease-in-out infinite; }
  .fam-animal .avstage { animation:av-breathe var(--av-breathe) ease-in-out infinite; transform-origin:50% 80%; }
  /* the succulent's whole personality is that it does not bother moving */
  .avwrap[data-kind="succulent"] .avstage { animation:none; }
  @keyframes av-sway   { 0%,100%{ transform:rotate(-2deg);} 50%{ transform:rotate(2deg);} }
  @keyframes av-breathe{ 0%,35%,100%{ transform:scale(1);} 65%{ transform:scale(1.025);} }
  .avwrap.happy .avstage { animation:av-bounce .6s ease; }
  @keyframes av-bounce { 0%,100%{ transform:translateY(0) scale(1);} 30%{ transform:translateY(-9px) scale(1.06);} 60%{ transform:translateY(0) scale(.97);} }
  .av-spark { opacity:0; }
  .avwrap.happy .av-spark { animation:av-spark .6s ease; }
  @keyframes av-spark { 0%{ opacity:0; transform:scale(.4);} 40%{ opacity:1;} 100%{ opacity:0; transform:scale(1.3);} }
  .avwrap[data-interactive] { cursor:pointer; }
  .av-bubble { display:inline-block; margin-top:.35rem; font-size:.82rem; font-weight:800;
               color:var(--accent); opacity:0; transition:opacity .15s; min-height:1.1em; }
  .avwrap[data-interactive]:hover .av-bubble,
  .avwrap[data-interactive]:focus-within .av-bubble { opacity:1; }
  .av-bubble.show { opacity:1; }

  .avwrap[data-kind="dog"] { --av-breathe:5.7s; }
  .avwrap[data-kind="owl"] { --av-breathe:8.2s; }
  .avwrap[data-kind="bonsai"] { --av-sway:9.1s; }
  .avwrap[data-motion-paused="1"] *, .avwrap[data-motion-paused="1"] {
    animation-play-state:paused !important; transition:none !important;
  }
  .av-caring-water .av-leaf > path { animation:av-leaf-settle 1.8s ease .8s; transform-box:fill-box; transform-origin:50% 95%; }
  @keyframes av-leaf-settle { 0%,100%{transform:rotate(0);} 35%{transform:rotate(3deg);} 70%{transform:rotate(-1.5deg);} }
  /* ---- eyes / part groups (art in _avatars_art.html) -------------------- */
  .av-lid  { transform:scaleY(0); transform-box:fill-box; transform-origin:50% 0; transition:transform .25s; }
  .av-head, .av-tail, .av-ear-l, .av-ear-r, .av-wing-l, .av-wing-r, .av-cap,
  .av-fin-t, .av-fin-b, .av-bloom, [class*="av-frond"] { transform-box:fill-box; }
  .av-head   { transform-origin:50% 85%; }
  .av-tail   { transform-origin:15% 90%; }
  .av-ear-l, .av-ear-r { transform-origin:50% 95%; }
  .av-wing-l { transform-origin:92% 25%; }
  .av-wing-r { transform-origin:8% 25%; }
  .av-cap    { transform-origin:50% 88%; }
  .av-fin-t  { transform-origin:90% 50%; }
  .av-fin-b  { transform-origin:50% 10%; }
  .av-bloom  { transform-origin:50% 55%; }
  [class*="av-frond"] { transform-origin:50% 100%; }
  /* hide the drop PATHS, not the group: the av-drop keyframes animate each
     path's own opacity, and a child can never out-opacity an opacity:0 parent */
  .av-bubbles, .av-spore, .av-food, .av-drops path { opacity:0; }
  .av-soilwet { opacity:0; }

  /* ---- idle behaviors: avatars.js toggles av-do-* per species ------------ */
  .av-do-blink .av-lid       { animation:av-blink .28s ease; }
  .av-do-slowblink .av-lid   { animation:av-blink 1.1s ease; }
  @keyframes av-blink  { 0%,100%{ transform:scaleY(0);} 35%,65%{ transform:scaleY(1);} }
  .av-do-ear .av-ear-l       { animation:av-earflick .5s ease; }
  .av-do-ear2 .av-ear-r      { animation:av-earflick .5s ease .12s; }
  @keyframes av-earflick { 0%,100%{ transform:rotate(0);} 40%{ transform:rotate(-13deg);} }
  .av-do-wag .av-tail        { animation:av-wag .9s ease-in-out; }
  @keyframes av-wag    { 0%,100%{ transform:rotate(0);} 20%{ transform:rotate(14deg);} 45%{ transform:rotate(-10deg);} 70%{ transform:rotate(12deg);} }
  .av-do-hop .avstage        { animation:av-hop .7s ease; }
  @keyframes av-hop    { 0%,100%{ transform:translateY(0);} 30%{ transform:translateY(-11px);} 55%{ transform:translateY(0);} 75%{ transform:translateY(-5px);} }
  .av-do-tilt .av-head       { animation:av-tilt 1.6s ease; }
  @keyframes av-tilt   { 0%,100%{ transform:rotate(0);} 30%,70%{ transform:rotate(9deg);} }
  .av-do-stretch .avstage    { animation:av-stretch 1.2s ease; }
  @keyframes av-stretch{ 0%,100%{ transform:scale(1,1);} 35%{ transform:scale(1.04,.93);} 70%{ transform:scale(.97,1.06);} }
  .av-do-flap .av-wing-l     { animation:av-flap-l .5s ease-in-out 2; }
  .av-do-flap .av-wing-r     { animation:av-flap-r .5s ease-in-out 2; }
  @keyframes av-flap-l { 0%,100%{ transform:rotate(0);} 50%{ transform:rotate(-24deg);} }
  @keyframes av-flap-r { 0%,100%{ transform:rotate(0);} 50%{ transform:rotate(24deg);} }
  .av-do-peek .avstage       { animation:av-crouch 1.5s ease; }
  @keyframes av-crouch { 0%,100%{ transform:scale(1,1);} 25%,60%{ transform:scale(1.05,.84);} }
  .av-do-hide .av-head       { animation:av-retract 1.8s ease; }
  .av-turtle-head { --av-retract-x:-26px; --av-retract-y:7px; --av-retract-scale:.55; }
  @keyframes av-retract{ 0%,100%{ transform:translateX(0);} 30%,65%{ transform:translate(var(--av-retract-x,-8px),var(--av-retract-y,0px)) scale(var(--av-retract-scale,.92));} }
  .av-do-turn .av-head       { animation:av-headturn 2.4s ease-in-out; }
  @keyframes av-headturn { 0%,100%{ transform:rotate(0);} 30%{ transform:rotate(-11deg);} 65%{ transform:rotate(11deg);} }
  .av-do-bubbles .av-bubbles { animation:av-rise 1.6s ease-out; }
  @keyframes av-rise   { 0%{ opacity:0; transform:translateY(4px);} 30%{ opacity:1;} 100%{ opacity:0; transform:translateY(-12px);} }
  .av-do-fin .av-fin-t       { animation:av-finflick .7s ease-in-out; }
  @keyframes av-finflick { 0%,100%{ transform:rotate(0);} 35%{ transform:rotate(-11deg);} 70%{ transform:rotate(7deg);} }
  .av-do-ripple [class*="av-frond"] { animation:av-frondsway 1.1s ease-in-out; }
  .av-do-ripple .av-frond-2  { animation-delay:.1s; }
  .av-do-ripple .av-frond-3  { animation-delay:.2s; }
  .av-do-ripple .av-frond-4  { animation-delay:.3s; }
  .av-do-ripple .av-frond-5  { animation-delay:.4s; }
  .av-do-ripple .av-frond-6  { animation-delay:.5s; }
  @keyframes av-frondsway { 0%,100%{ transform:rotate(0);} 35%{ transform:rotate(-5deg);} 70%{ transform:rotate(4deg);} }
  .av-do-wobble .av-cap      { animation:av-wobble .9s ease; }
  @keyframes av-wobble { 0%,100%{ transform:rotate(0);} 25%{ transform:rotate(-7deg);} 55%{ transform:rotate(5deg);} 80%{ transform:rotate(-2deg);} }
  .av-do-spore .av-spore     { animation:av-rise 1.4s ease-out; }
  .av-do-plump .avstage,
  .avwrap[data-kind="succulent"].av-do-plump .avstage { animation:av-plump 1s ease; }
  @keyframes av-plump  { 0%,100%{ transform:scale(1);} 45%{ transform:scale(1.07);} }
  .av-do-bloom .av-bloom     { animation:av-bloomturn 3s ease-in-out; }
  @keyframes av-bloomturn { 0%,100%{ transform:rotate(0);} 35%{ transform:rotate(9deg);} 75%{ transform:rotate(-6deg);} }

  /* ---- ground-roam gaits: avatars.js toggles these while a walker travels
          a leg (dog trots/zooms, rabbit+bird bound, turtle plods) ----------- */
  .av-do-trot .avstage, .av-do-zoom .avstage { animation:av-trot .5s ease-in-out infinite; }
  .av-do-zoom .avstage       { animation-duration:.26s; }
  @keyframes av-trot   { 0%,100%{ transform:translateY(0) rotate(0);} 50%{ transform:translateY(-3px) rotate(1.4deg);} }
  .av-do-bound .avstage      { animation:av-bound .45s ease-in-out infinite; }
  @keyframes av-bound  { 0%,100%{ transform:translateY(0) scale(1,1);} 40%{ transform:translateY(-10px) scale(.96,1.05);} 80%{ transform:translateY(0) scale(1.04,.94);} }
  /* chase: a faster, much springier run, and a big pounce when it catches up */
  .av-chasing .avstage       { animation:av-chase-leap .34s ease-in-out infinite !important; }
  @keyframes av-chase-leap { 0%,100%{ transform:translateY(0) scale(1.05,.93);} 45%{ transform:translateY(-26px) scale(.95,1.08);} }
  .av-pounce .avstage        { animation:av-pounce .8s cubic-bezier(.3,.7,.4,1) !important; }
  @keyframes av-pounce { 0%{ transform:translateY(0) scale(1.08,.9);} 35%{ transform:translateY(-48px) scale(.94,1.1) rotate(-6deg);} 65%{ transform:translateY(0) scale(1.1,.88);} 82%{ transform:translateY(-12px);} 100%{ transform:translateY(0);} }
  .av-do-plod .avstage       { animation:av-plod 1.6s ease-in-out infinite; }
  @keyframes av-plod   { 0%,100%{ transform:rotate(-1.3deg);} 50%{ transform:rotate(1.3deg);} }

  /* ---- care: watering / feeding (button sets av-caring-* on the wrap) ---- */
  .av-care-btn, .av-sound-btn, .av-explore-btn { display:inline-block; font:inherit; font-size:.78rem; font-weight:800; cursor:pointer;
                 margin-top:.3rem; border:1px solid var(--line); border-radius:999px;
                 background:var(--surface); color:var(--ink-soft); padding:.24rem .8rem;
                 transition:transform .1s, border-color .15s; }
  .av-care-btn:hover, .av-care-btn:focus-visible,
  .av-sound-btn:hover, .av-sound-btn:focus-visible,
  .av-explore-btn:hover, .av-explore-btn:focus-visible { border-color:var(--accent); color:var(--accent); transform:translateY(-1px); }
  .av-sound-btn, .av-explore-btn { padding:.24rem .55rem; }
  .av-sound-controls { display:inline-flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.3rem; max-width:100%; }
  .av-volume { width:72px; max-width:100%; min-height:44px; margin:0; accent-color:var(--accent); }
  .av-volume[hidden] { display:none; }
  .av-audio-credits { font-size:.75rem; flex-basis:100%; }
  .av-sound-btn[aria-pressed="true"], .av-explore-btn[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); background:var(--accent-bg); }
  .av-caring-water .av-drops path { animation:av-drop 1.2s ease-in; }
  .av-caring-water .av-drops path:nth-child(2) { animation-delay:.18s; }
  .av-caring-water .av-drops path:nth-child(3) { animation-delay:.36s; }
  @keyframes av-drop   { 0%{ opacity:0; transform:translateY(0);} 15%{ opacity:1;} 80%{ opacity:1; transform:translateY(66px);} 100%{ opacity:0; transform:translateY(72px);} }
  .av-caring-water .av-soilwet { animation:av-soak 3.5s ease; }
  @keyframes av-soak   { 0%{ opacity:0;} 30%,75%{ opacity:.8;} 100%{ opacity:0;} }
  .av-caring-water .avstage { animation:av-perk 1.6s ease .9s; }
  @keyframes av-perk   { 0%,100%{ transform:scale(1,1);} 40%{ transform:scale(1.02,1.06);} 70%{ transform:scale(1,1.02);} }
  .av-caring-water .av-frond-top { animation:av-unfurl 1.4s ease .9s; }
  @keyframes av-unfurl { 0%{ transform:rotate(0) scale(1);} 40%{ transform:rotate(-8deg) scale(1.06);} 100%{ transform:rotate(0) scale(1);} }
  /* the succulent's animation:none kill rule outranks av-perk, so it gets its
     own (species-true) watered response: a satisfied plump */
  .avwrap[data-kind="succulent"].av-caring-water .avstage { animation:av-plump 1s ease .9s; }
  .av-caring-feed .av-food  { animation:av-feed 1.5s ease-in forwards; }
  @keyframes av-feed   { 0%{ opacity:0; transform:translate(0,0);} 15%{ opacity:1;} 55%{ opacity:1; transform:translate(-18px,26px);} 75%{ opacity:1; transform:translate(-30px,44px) scale(.7);} 100%{ opacity:0; transform:translate(-32px,46px) scale(.3);} }
  .av-caring-feed .av-head  { animation:av-chew .5s ease 1.2s 3; }
  @keyframes av-chew   { 0%,100%{ transform:translateY(0) rotate(0);} 50%{ transform:translateY(1.6px) rotate(1.6deg);} }

  /* ---- night-time sleep (avatars.js toggles av-asleep 9pm-6am; the bat is
          nocturnal and never gets the class) ------------------------------- */
  .av-zzz { opacity:0; }
  .avwrap.av-asleep .av-zzz { opacity:1; animation:av-zfloat 2.6s ease-in-out infinite; }
  @keyframes av-zfloat { 0%,100%{ opacity:.35; transform:translateY(0);} 50%{ opacity:1; transform:translateY(-5px);} }
  .avwrap.av-asleep .av-lid { transform:scaleY(1); }
  .avwrap.av-asleep { --av-sway:10s; --av-breathe:7s; }

  /* ---- petting (press & hold; avatars.js sets av-petting + spawns hearts) - */
  .av-petting .avstage { animation:av-nuzzle .8s ease-in-out infinite; }
  @keyframes av-nuzzle { 0%,100%{ transform:rotate(-1.6deg);} 50%{ transform:rotate(1.6deg);} }
  .av-heart { position:absolute; top:30%; opacity:0; font-size:.9rem; color:#e0607e;
              pointer-events:none; animation:av-heartfloat 1.5s ease-out forwards; }
  @keyframes av-heartfloat { 0%{ opacity:0; transform:translateY(0) scale(.7);} 25%{ opacity:1;} 100%{ opacity:0; transform:translateY(-34px) scale(1.15);} }

  /* ---- fresh-badge toast (avatars.js shows it when /avatar/care awards) --- */
  .av-badge-toast { position:absolute; left:50%; top:-1.6rem; transform:translateX(-50%);
                    white-space:nowrap; font-size:.8rem; font-weight:800; color:var(--accent);
                    background:var(--surface); border:1px solid var(--accent);
                    border-radius:999px; padding:.25rem .8rem; pointer-events:none;
                    animation:av-toast 4s ease forwards; z-index:5; }
  @keyframes av-toast { 0%{ opacity:0; transform:translate(-50%, 8px);} 12%,80%{ opacity:1; transform:translate(-50%, 0);} 100%{ opacity:0; transform:translate(-50%, -8px);} }

  /* ---- mood (data-mood from storage.avatar_mood) ------------------------- */
  .avwrap[data-mood="happy"]  { --av-sway:3.6s; --av-breathe:2.7s; }
  .avwrap[data-mood="droopy"] { --av-sway:8s; --av-breathe:6s; }
  .avwrap[data-mood="droopy"] svg { filter:saturate(.55) brightness(.97); }
  .avwrap[data-mood="droopy"] svg[data-avatar-art="v2"] { filter:none; opacity:.86; }
  .avwrap[data-mood="droopy"] .av-lid { transform:scaleY(.45); }
  .avwrap[data-mood="droopy"] .avstage { transform-origin:50% 92%; }

  /* ---- explore: the swimmer leaves its card and swims the whole page.
          z-index 14 glides UNDER the sticky chrome (scopebar 15, topnav 20)
          and over unpositioned content; the layer never blocks clicks — only
          the pet itself is tappable (tap = come home). ---------------------- */
  .av-explore-layer { position:fixed; inset:0; z-index:14; pointer-events:none; }
  .av-explore-pet   { position:fixed; left:0; top:0; display:inline-block; text-align:center;
                      will-change:transform; pointer-events:auto; cursor:pointer;
                      --av-sway:7s; --av-breathe:6.4s; }
  .avwrap.av-away .av-bubble { opacity:0; }

  /* ---- drag (wellness hub play area) ------------------------------------- */
  .av-play { position:relative; }
  .avwrap[data-drag] { touch-action:none; }
  .avwrap[data-drag].av-dragging { transition:none; cursor:grabbing; }
  .avwrap[data-drag]:not(.av-dragging) { transition:transform .3s ease; }

  /* picker thumbnails reuse the plant sway */
  .av-sway-c { transform-origin:50% 90%; animation:av-sway 5s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .avwrap .avstage, .avwrap.happy .avstage, .av-sway-c,
    .avwrap [class*="av-"], .avwrap .av-drops path,
    .avwrap[class*="av-do-"] * { animation:none !important; }
    .avwrap.happy .av-spark { animation:none; opacity:0; }
    .avwrap[data-drag]:not(.av-dragging) { transition:none; }
  }
  /* Static preview policy: only a live companion runs reactions. */
  .avwrap[data-kind]:not([data-interactive]) *,
  .avwrap[data-kind]:not([data-interactive]) [class],
  .avcard > span, .avcard svg *, .avcard svg [class] {
    animation:none !important; transition:none !important;
  }
  /* End static preview policy. */
</style><svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">

      <stop offset="0" stop-color="#a8e0dd"/><stop offset="1" stop-color="#5fb3af"/></linearGradient>
    <linearGradient id="avg-bird2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2f5f4"/><stop offset="1" stop-color="#b7e6e4"/></linearGradient>
