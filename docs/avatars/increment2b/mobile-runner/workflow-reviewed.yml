name: Avatar cloud runner diagnostic

# The PR trigger validates initial setup before default-branch registration.
# Once merged, Run workflow is available in GitHub's phone browser UI.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/avatar-runner-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: avatar-cloud-runner-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    name: Cloud runner diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: python:3.12.14-trixie@sha256:4d1caded1f729ae443eb803f26ffde7b61e696aeaef62f099abb6dd6b14257c7
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the frozen diagnostic harness
        uses: actions/checkout@v4
        with:
          # Never check out product changes from the pull-request head.
          ref: 92b842826b60b8741e3032f252c09b6e350af66d
          fetch-depth: 0
          persist-credentials: false

      - name: Install exact browser and hash-locked dependencies
        run: |
          set -euo pipefail
          mkdir -p runner-diagnostic
          exec > >(tee runner-diagnostic/setup.log) 2>&1
          apt-get update
          apt-get install -y --no-install-recommends \
            chromium=156.0.8078.47-1~deb13u1 \
            chromium-common=156.0.8078.47-1~deb13u1 \
            git procps binutils util-linux
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-test.txt
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-avatar-native.txt
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p /workspace/scratch/avatar-runtime/root/usr/lib/chromium
          ln -s /usr/lib/chromium/chromium /workspace/scratch/avatar-runtime/root/usr/lib/chromium/chromium

      - name: Check diagnostic accounting before measurement
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest -q \
            tests/test_hosted_runner_diagnostic.py \
            tests/test_control_phase_timing.py \
            tests/test_membership_lifecycle_analysis.py \
            tests/test_membership_lifecycle_summary.py \
            2>&1 | tee runner-diagnostic/preflight-tests.txt

      - name: Capture four fixed controls on this new runner
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.avatar_baseline.hosted_runner_diagnostic \
            --out runner-diagnostic/result \
            2>&1 | tee runner-diagnostic/run.log

      - name: Explain missing results on the phone summary
        if: always()
        run: |
          if [ ! -f runner-diagnostic/result/SUMMARY.md ]; then
            {
              echo '# Cloud runner diagnostic'
              echo ''
              echo 'Setup or preflight stopped before a complete result was available.'
              echo 'Open the failed step and download avatar-runner-diagnostic for retained logs.'
              echo 'No application acceptance or deployment occurred.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save all results and failures for download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-runner-diagnostic
          path: runner-diagnostic/
          if-no-files-found: warn
          retention-days: 30
