<fieldset><legend>Mention people (optional)</legend><p class="work-small">Choose up to 20 people who already have access. They receive an in-app update. Typing @names alone does not notify anyone.</p>
{% for person in mention_people %}<label style="font-weight:normal"><input style="display:inline;width:auto" type="checkbox" name="mentions" value="{{ person.id }}" {% if (submitted.get('action')==mention_action and person.id|string in submitted.get('mentions',[])) or (submitted.get('action')!=mention_action and person.id in mention_ids) %}checked{% endif %}> {{ person.name }}</label>{% else %}<p>No eligible people.</p>{% endfor %}</fieldset>
